# Браузеры Playwright с кэшем: ключ = образ раннера (ImageOS: ubuntu24/ubuntu26 — сборки WebKit разные), версия @playwright/test и набор браузеров.
# При попадании в кэш ставятся только системные зависимости (apt), сами браузеры не скачиваются.
name: Playwright browsers
description: Установить браузеры Playwright с кэшем ~/.cache/ms-playwright
inputs:
  browsers:
    description: 'Браузеры через пробел (chromium, webkit)'
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "pw=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.version.outputs.pw }}-${{ inputs.browsers }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browsers }}
    # Зеркало apt у раннера иногда отдаёт ~70 КБ/с, и job WebKit упирается в 20 минут. Попытка ограничена 5 минутами,
    # затем меняем зеркало и повторяем (скачанное остаётся в /var/cache/apt/archives, докачивается).
    - if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        for mirror in '' http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/; do
          if [ -n "$mirror" ]; then
            echo "::warning::apt медленный или упал — пробую зеркало $mirror"
            # timeout не достаёт apt-get, запущенный через sudo: добиваем сами ([a] — чтобы pkill не задел собственный sudo) и ждём освобождения блокировки dpkg
            sudo pkill -TERM -f '[a]pt-get|/usr/lib/[a]pt/methods/' || true
            for _ in $(seq 1 30); do pgrep -f '[a]pt-get|/usr/lib/[a]pt/methods/' >/dev/null || break; sleep 1; done
            sudo pkill -KILL -f '[a]pt-get|/usr/lib/[a]pt/methods/' || true
            sleep 2
            sudo dpkg --configure -a || true
            if [ -f /etc/apt/apt-mirrors.txt ]; then echo "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          fi
          if timeout -k 15 240 npx playwright install-deps ${{ inputs.browsers }}; then exit 0; fi
        done
        exit 1
